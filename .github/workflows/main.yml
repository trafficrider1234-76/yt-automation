name: YouTube Auto Shorts Bot

on:
  schedule:
    - cron: '0 9 * * *' # Har roz subah 9 baje run hoga
  workflow_dispatch: # Manual run button ke liye

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and Upgrade Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp moviepy google-api-python-client google-auth-oauthlib google-auth-httplib2 edge-tts requests

      - name: Run automation script
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Commit and push state update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_processed.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update progress state [skip ci]" && git push)
